# Dois modos (ADR-06):
#   docker compose up -d --wait                 desenvolvimento: só o PostgreSQL, com a porta
#                                               publicada; backend e web rodam na máquina
#   docker compose --profile app up -d --wait   pilha app: PostgreSQL próprio, migrações, API e
#                                               web com o build de produção; só o web é exposto
# A pilha app pode ser publicada pelo Cloudflare Tunnel, com docker-compose.tunnel.yml (ADR-08).
# O modo de desenvolvimento é o padrão porque o .env define COMPOSE_PROFILES=dev. O
# --profile app substitui esse padrão.
name: ro-lobby

x-postgres: &postgres
  image: mirror.gcr.io/library/postgres:18-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 2s
    timeout: 3s
    retries: 15

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
  POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
  TZ: UTC
  PGTZ: UTC

# Endurecimento, RN-01: a pilha app usa a própria senha, separada da de desenvolvimento.
x-app-database-url: &app-database-url postgres://${POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@app-postgres:5432/${POSTGRES_DB}?sslmode=disable

services:
  # Desenvolvimento (RN-03 da fundação, RN-04 da home-local)
  postgres:
    <<: *postgres
    profiles: [dev]
    environment:
      <<: *postgres-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    # Endurecimento, RN-06: só o próprio PC alcança o banco de desenvolvimento.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  # Pilha app (RN-01 a RN-03 da home-local)

  # Endurecimento, RN-02 e RN-04: confere o .env antes de o banco subir. Com origem
  # pública, recusa senha curta e valores do .env.example, sem mostrar nenhum valor. Roda
  # sem rede e sai.
  env-check:
    profiles: [app]
    image: mirror.gcr.io/library/postgres:18-alpine
    entrypoint: ["sh", "/check/check-env.sh", "--from-environment", "--example", "/check/.env.example"]
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
    volumes:
      - ./scripts/check-env.sh:/check/check-env.sh:ro
      - ./.env.example:/check/.env.example:ro
    network_mode: none
    restart: "no"

  app-postgres:
    <<: *postgres
    profiles: [app]
    environment:
      <<: *postgres-env
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?defina APP_POSTGRES_PASSWORD no .env}
    # Sem porta publicada: só a rede interna do Compose alcança o banco da pilha.
    volumes:
      - app-postgres-data:/var/lib/postgresql
    depends_on:
      env-check:
        condition: service_completed_successfully

  migrate:
    profiles: [app]
    build: ./backend
    image: ro-lobby-api:local
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: *app-database-url
    depends_on:
      app-postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    image: ro-lobby-api:local
    environment:
      DATABASE_URL: *app-database-url
      API_PORT: "8080"
      # RN-03 (login-discord): o Client Secret só existe no ambiente da API.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?defina DISCORD_CLIENT_ID no .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?defina DISCORD_CLIENT_SECRET no .env}
      DISCORD_API_BASE_URL: ${DISCORD_API_BASE_URL:-https://discord.com/api}
      # Sala do grupo no Discord (spec discord-bot, RN-22): as duas juntas ligam; vazias, desligam.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Link do lobby nas mensagens do bot (spec discord-bot, RN-08), a mesma origem do web.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${APP_WEB_PORT:-3000}}
    # RN-02: a API só sobe depois que as migrações terminam com sucesso.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    profiles: [app]
    build: ./web
    image: ro-lobby-web:local
    environment:
      PORT: "3000"
      API_BASE_URL: http://api:8080
      # RN-03 (login-discord): o web recebe só o Client ID, nunca o Client Secret.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?defina DISCORD_CLIENT_ID no .env}
      DISCORD_AUTHORIZE_URL: ${DISCORD_AUTHORIZE_URL:-https://discord.com/oauth2/authorize}
      # Spec discord-em-construcao, RN-01: a entrada no servidor e a sala do grupo ficam em
      # construção no site até o servidor oficial ficar pronto. false volta ao normal.
      DISCORD_UNDER_CONSTRUCTION: ${DISCORD_UNDER_CONSTRUCTION:-true}
      # O adapter-node confere a origem das actions (proteção CSRF). RN-01
      # (publicacao-tunel): APP_ORIGIN troca a origem pelo domínio público.
      ORIGIN: ${APP_ORIGIN:-http://localhost:${APP_WEB_PORT:-3000}}
    # Endurecimento, RN-06: só o próprio PC; o túnel chega pela rede interna do Compose.
    ports:
      - "127.0.0.1:${APP_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  app-postgres-data:
