# Configuração do oapi-codegen (ADR-05). Gera os tipos e a interface do servidor
# para net/http a partir do openapi.yaml da raiz.
package: api
output: api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
# Prefixa as constantes de enum com o nome do tipo (ex.: RoleTank, FieldErrorFieldRole),
# para os valores de enums diferentes não colidirem com os nomes dos tipos.
compatibility:
  always-prefix-enum-values: true
