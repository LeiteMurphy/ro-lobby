# Configuração do golangci-lint (RN-18). O gofmt roda num passo próprio da CI.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - noctx
    - unconvert

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict

run:
  build-tags:
    - integration
