# Endurecimento, RN-10 / CA-03.3: o Dependabot confere as dependências uma vez por semana.
# Os PRs que ele abrir passam pela CI como qualquer outro.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /backend
      - /web
    schedule:
      interval: weekly
