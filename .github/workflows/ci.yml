# CI da fundação (US-06). Um único workflow com filtro de caminhos (D-08): cada job só
# roda quando a pasta dele muda, e o job `ci-ok` é o check obrigatório da main. Job
# pulado conta como sucesso, então um PR só de documentação não trava o merge.
name: CI

on:
  pull_request:
    # RN-17 pede a main. As branches de feature entram para PRs empilhados dentro de
    # uma feature, como os PRs de demonstração da T-10.
    branches: [main, 'feature/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valor fictício, só para o PostgreSQL de serviço da CI.
  DATABASE_URL: postgres://ro_lobby:ro_lobby_ci@localhost:5432/ro_lobby?sslmode=disable

jobs:
  changes:
    name: Filtro de caminhos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      # RN-17: o contrato e a própria CI disparam os dois jobs.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'openapi.yaml'
              - '.github/workflows/**'
            backend:
              - *shared
              - 'backend/**'
            web:
              - *shared
              - 'web/**'
              - '.nvmrc'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # O contexto `env` não vale aqui; os valores repetem os do topo.
          POSTGRES_USER: ro_lobby
          POSTGRES_PASSWORD: ro_lobby_ci
          POSTGRES_DB: ro_lobby
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ro_lobby -d ro_lobby"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      # RN-04 / CA-01.4: a versão do Go vem do go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # CA-01.5: todo arquivo de texto versionado usa LF.
      - name: Quebra de linha LF
        working-directory: .
        run: |
          crlf=$(git ls-files --eol | awk '$1 != "i/lf" && $1 != "i/none" && $1 != "i/-text"')
          if [ -n "$crlf" ]; then echo "Arquivos sem LF:"; echo "$crlf"; exit 1; fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Fora do gofmt:"; echo "$unformatted"; exit 1; fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # Compila com o Go do go.mod, para o lint entender a mesma versão da linguagem.
          install-mode: goinstall
          working-directory: backend

      # RN-12 / CA-04.2 / CA-04.3: o código gerado bate com o contrato e as queries.
      - name: Código gerado em dia
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --short -- .; git diff -- .
            echo "::error::Código gerado desatualizado. Rode 'go generate ./...' em backend/ e faça commit."; exit 1
          fi

      - name: Testes unitários (sem banco)
        run: go test -race -coverprofile=coverage-unit.out ./...

      - name: Migrações
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate status

      # RN-10 / CA-06.6: integração contra o PostgreSQL do container de serviço.
      - name: Testes de integração
        run: go test -race -tags=integration -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o bin/ ./cmd/...

      # RN-21 / CA-08.1: cobertura publicada, sem percentual mínimo.
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo "### Cobertura do backend (unitários + integração)"
              echo '```'
              go tool cover -func=coverage.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            go tool cover -html=coverage.out -o coverage.html
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-backend
          path: |
            backend/coverage.out
            backend/coverage-unit.out
            backend/coverage.html
          if-no-files-found: ignore

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # RN-04 / CA-01.4: a versão do Node vem do .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Quebra de linha LF
        working-directory: .
        run: |
          crlf=$(git ls-files --eol | awk '$1 != "i/lf" && $1 != "i/none" && $1 != "i/-text"')
          if [ -n "$crlf" ]; then echo "Arquivos sem LF:"; echo "$crlf"; exit 1; fi

      # RN-12 / CA-04.2 / CA-04.3
      - name: Código gerado em dia
        run: |
          npm run generate
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --short -- .; git diff -- .
            echo "::error::Tipos gerados desatualizados. Rode 'npm run generate' em web/ e faça commit."; exit 1
          fi

      - name: ESLint e Prettier
        run: npm run lint

      # RN-16 / CA-06.8: TypeScript estrito.
      - name: svelte-check
        run: npm run check

      - name: Vitest com cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # RN-21 / CA-08.1
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Cobertura do web", "| Métrica | % | Cobertos |", "|---|---|---|",
                ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-web
          path: web/coverage/
          if-no-files-found: ignore

  e2e:
    name: Ponta a ponta
    needs: changes
    # D-09: roda quando backend, web ou contrato mudam.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # O contexto `env` não vale aqui; os valores repetem os do topo.
          POSTGRES_USER: ro_lobby
          POSTGRES_PASSWORD: ro_lobby_ci
          POSTGRES_DB: ro_lobby
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ro_lobby -d ro_lobby"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dependências do web
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Migrações
        working-directory: backend
        run: go run ./cmd/migrate up

      # RN-22 / CA-07.1
      - name: Playwright
        working-directory: web
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  ci-ok:
    name: CI ok
    needs: [changes, backend, web, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # RN-20: qualquer job com falha ou cancelado deixa este check vermelho.
      - name: Conferir os jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Algum job terminou como '$r'."; exit 1 ;;
            esac
          done
