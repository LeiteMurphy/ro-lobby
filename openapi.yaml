# Contrato da API do RO Lobby (ADR-05, RN-11). Toda rota nova começa aqui.
# Depois de mudar este arquivo, gere o código de novo:
#   backend: go generate ./...     web: npm run generate
openapi: 3.0.3
info:
  title: RO Lobby API
  version: 0.1.0
  description: API do RO Lobby, lobby de fãs para montar grupos em Ragnarok Online.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Estado da API e do banco
      description: >
        Responde 200 quando o banco responde a um ping em até 2 segundos (RN-06) e
        503 quando não responde nesse prazo (RN-07).
      responses:
        "200":
          description: API e banco saudáveis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                database: ok
        "503":
          description: API no ar, mas o banco não respondeu em até 2 segundos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: degraded
                database: unavailable
  /auth/discord:
    post:
      operationId: createSessionFromDiscord
      summary: Troca o código do Discord por uma sessão
      description: >
        Chamado pelo servidor do web depois do retorno do Discord (ADR-07). A API troca o
        código no Discord, cria ou atualiza o Usuário pelo ID do Discord e abre uma Sessão
        (RN-04, RN-05, RN-07). Se o Discord falhar, nada é criado (RN-13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordLogin"
      responses:
        "201":
          description: Sessão criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          description: O Discord recusou o código, ou o pedido veio sem código.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_code
        "502":
          description: O Discord não respondeu em até 5 segundos ou respondeu com erro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: discord_unavailable
  /me:
    get:
      operationId: getMe
      summary: Usuário da sessão
      description: Responde 401 sem sessão válida (RN-10, RN-16).
      security:
        - sessionToken: []
      responses:
        "200":
          description: Usuário da sessão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Sem sessão, ou sessão desconhecida ou vencida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no_session
  /session:
    delete:
      operationId: deleteSession
      summary: Encerra a sessão atual
      description: Apaga só esta Sessão; outras sessões do Usuário continuam (RN-11).
      security:
        - sessionToken: []
      responses:
        "204":
          description: Sessão encerrada (ou já não existia).
  /classes:
    get:
      operationId: listClasses
      summary: Catálogo de classes
      description: >
        As classes do bRO, conforme o bROWiki, na ordem da página (spec personagens, RN-06,
        RN-20). Não exige sessão.
      responses:
        "200":
          description: Todas as classes do catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
  /characters:
    get:
      operationId: listCharacters
      summary: Personagens do Usuário da sessão
      description: O principal primeiro, depois por ordem de cadastro (RN-01, RN-17).
      security:
        - sessionToken: []
      responses:
        "200":
          description: Personagens do Usuário.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/NoSession"
    post:
      operationId: createCharacter
      summary: Cadastra um personagem
      description: >
        O primeiro personagem do Usuário vira o principal (RN-12). O nick é único em todo o
        RO Lobby, sem diferenciar maiúsculas (RN-05), e cada Usuário tem até 10 personagens
        (RN-11).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Personagem criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/NoSession"
        "409":
          description: O Usuário já tem 10 personagens (RN-11).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: character_limit
        "422":
          $ref: "#/components/responses/Invalid"
  /characters/{id}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: updateCharacter
      summary: Edita um personagem
      description: Grava todos os campos, com as mesmas regras do cadastro (RN-15).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "200":
          description: Personagem editado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O personagem é dono de um lobby aberto (RN-21 da spec lobbies).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: character_in_open_lobby
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteCharacter
      summary: Exclui um personagem
      description: Se era o principal, o mais antigo que sobrar vira o principal (RN-14).
      security:
        - sessionToken: []
      responses:
        "204":
          description: Personagem excluído.
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O personagem é dono de um lobby aberto (RN-21 da spec lobbies).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: character_in_open_lobby
  /characters/{id}/main:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: setMainCharacter
      summary: Torna o personagem o principal
      description: O principal anterior deixa de ser (RN-13, D-01).
      security:
        - sessionToken: []
      responses:
        "204":
          description: Personagem marcado como principal.
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/NotFound"
  /characters/{id}/availability:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: setAvailability
      summary: Liga, edita ou desliga o personagem no banco de talentos
      description: >
        Ligado, grava dias, faixa e instâncias (spec banco-de-talentos, RN-01 a RN-04).
        Desligado, tira do banco e guarda os dados (RN-01); os outros campos são ignorados.
        Só o dono do personagem (RN-05).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityInput"
      responses:
        "200":
          description: Disponibilidade gravada; null se desligou sem nunca ter ligado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResult"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /talents:
    get:
      operationId: listTalents
      summary: Catálogo do banco de talentos
      description: >
        Os personagens no banco, com filtros opcionais combinados com "E" (spec
        banco-de-talentos, RN-11), por nível decrescente (RN-08), até 100. A sessão é
        opcional; o nome no Discord só vem com ela (RN-12, D-05).
      security:
        - {}
        - sessionToken: []
      parameters:
        - name: instanceId
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - name: day
          in: query
          description: Dia da semana, domingo = 0.
          schema:
            type: integer
        - name: time
          in: query
          description: Hora de Brasília, HH:MM de 30 em 30 minutos.
          schema:
            type: string
      responses:
        "200":
          description: Os personagens do banco que passam nos filtros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Talent"
        "422":
          $ref: "#/components/responses/Invalid"
  /talents/count:
    get:
      operationId: countTalents
      summary: Quantos personagens têm afinidade com um lobby em criação
      description: >
        A mesma afinidade do lobby gravado (RN-06), com os campos do formulário de criação
        (RN-10, D-04). As vagas abertas são as do formulário menos a do personagem do dono;
        no grupo livre, formation=free e freeSlots no lugar de tank, support e dps (spec
        grupo-livre, RN-13).
      security:
        - sessionToken: []
      parameters:
        - name: instanceId
          in: query
          schema:
            type: string
        - name: anyInstance
          in: query
          description: Lobby sem instância (spec lobby-sem-instancia, RN-07).
          schema:
            type: boolean
        - name: startsAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: minLevel
          in: query
          required: true
          schema:
            type: integer
        - name: tank
          in: query
          schema:
            type: integer
        - name: support
          in: query
          schema:
            type: integer
        - name: dps
          in: query
          schema:
            type: integer
        - name: formation
          in: query
          schema:
            $ref: "#/components/schemas/Formation"
        - name: freeSlots
          in: query
          schema:
            type: integer
        - name: characterId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A contagem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentCount"
        "401":
          $ref: "#/components/responses/NoSession"
        "422":
          $ref: "#/components/responses/Invalid"
  /instances:
    get:
      operationId: listInstances
      summary: Catálogo de instâncias
      description: >
        As instâncias de grupo do bROWiki, na ordem da escolha: nível 130 ou mais primeiro,
        depois as de nível menor; em cada parte, nível decrescente (spec lobbies, RN-01,
        RN-02). Não exige sessão.
      responses:
        "200":
          description: Todas as instâncias do catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
  /lobbies:
    get:
      operationId: listLobbies
      summary: Lobbies abertos num intervalo de dias
      description: >
        Lobbies abertos (não cancelados e ainda não iniciados) com início entre os dias
        from e to, no fuso de São Paulo, por horário (RN-13, RN-14, RN-22). Não exige
        sessão.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lobbies abertos do intervalo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lobby"
        "400":
          description: Intervalo de datas inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_range
    post:
      operationId: createLobby
      summary: Cria um lobby
      description: >
        O dono escolhe um dos próprios personagens, que ocupa a vaga da função dele
        (RN-08), ou uma das vagas no grupo livre (spec grupo-livre, RN-02). Cada Usuário tem
        até 5 lobbies abertos (RN-11), e o personagem não pode estar em outro lobby a menos
        de 2 h (RN-10).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LobbyInput"
      responses:
        "201":
          description: Lobby criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "401":
          $ref: "#/components/responses/NoSession"
        "409":
          description: O Usuário já tem 5 lobbies abertos (RN-11).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: lobby_limit
        "422":
          $ref: "#/components/responses/Invalid"
  /lobbies/{id}:
    parameters:
      - $ref: "#/components/parameters/LobbyId"
    get:
      operationId: getLobby
      summary: Detalhe do lobby
      description: >
        O lobby em qualquer estado (RN-15). A sessão é opcional e muda o que vem: todos
        veem os membros e a quantidade de pendentes; o Discord dos membros só vai para o
        dono e para os membros (RN-32); os pendentes só vão para o dono (RN-28); quem se
        candidatou recebe a própria candidatura (RN-29, D-06).
      security:
        - {}
        - sessionToken: []
      responses:
        "200":
          description: O lobby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "404":
          $ref: "#/components/responses/LobbyNotFound"
    put:
      operationId: updateLobby
      summary: Edita o lobby
      description: >
        Só o dono e só com o lobby aberto. Muda início, vagas, nível mínimo e observação;
        instância e personagem ficam (RN-17, RN-18).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LobbyUpdate"
      responses:
        "200":
          description: Lobby editado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/LobbyNotFound"
        "409":
          $ref: "#/components/responses/LobbyNotOpen"
        "422":
          $ref: "#/components/responses/Invalid"
  /lobbies/{id}/unblock:
    parameters:
      - $ref: "#/components/parameters/LobbyId"
    post:
      operationId: unblockInLobby
      summary: Desbloqueia o jogador neste lobby
      description: >
        O dono do lobby aberto desbloqueia o usuário do personagem, que volta a poder se
        candidatar (spec candidatura-lobby, RN-15, CA-06.9). A candidatura removida fica no
        histórico. Personagem sem bloqueio não muda nada.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnblockInput"
      responses:
        "204":
          description: Desbloqueado.
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/LobbyNotFound"
        "409":
          $ref: "#/components/responses/LobbyNotOpen"
  /lobbies/{id}/talents:
    parameters:
      - $ref: "#/components/parameters/LobbyId"
    get:
      operationId: listLobbyTalents
      summary: Personagens do banco com afinidade com o lobby
      description: >
        Só o dono, só com o lobby aberto (spec banco-de-talentos, RN-06 a RN-09). Lobby de
        outro Usuário responde 404.
      security:
        - sessionToken: []
      responses:
        "200":
          description: Os personagens com afinidade, por nível decrescente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Talent"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/LobbyNotFound"
        "409":
          $ref: "#/components/responses/LobbyNotOpen"
  /lobbies/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/LobbyId"
    post:
      operationId: cancelLobby
      summary: Cancela o lobby
      description: Só o dono e só com o lobby aberto, com motivo de 10 a 250 caracteres (RN-19).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelLobby"
      responses:
        "200":
          description: Lobby cancelado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/LobbyNotFound"
        "409":
          $ref: "#/components/responses/LobbyNotOpen"
        "422":
          $ref: "#/components/responses/Invalid"
  /lobbies/{id}/owner-character:
    parameters:
      - $ref: "#/components/parameters/LobbyId"
    put:
      operationId: swapOwnerCharacter
      summary: O dono troca o próprio personagem no lobby
      description: >
        Sem aprovação, com o lobby aberto, por um personagem do próprio dono com vaga na
        função (a vaga que ele deixa conta como livre), o nível mínimo e sem conflito de
        horário (RN-11, RN-19, RN-36); no grupo livre, sem depender de vaga (spec
        grupo-livre, RN-05). Quem não é dono recebe 409 not_owner (CA-07.5).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerCharacterInput"
      responses:
        "200":
          description: O lobby com o personagem novo do dono, como no detalhe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/LobbyNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
        "422":
          $ref: "#/components/responses/Invalid"
  /lobbies/{id}/applications:
    parameters:
      - $ref: "#/components/parameters/LobbyId"
    post:
      operationId: applyToLobby
      summary: Candidata-se ao lobby
      description: >
        Com um dos próprios personagens, na função dele, se houver vaga e nível (RN-01 a
        RN-07, RN-30); no grupo livre, basta vaga no total (spec grupo-livre, RN-04,
        group_full). A candidatura fica pendente até o dono decidir.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyInput"
      responses:
        "201":
          description: Candidatura pendente criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/LobbyNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
        "422":
          $ref: "#/components/responses/Invalid"
  /applications/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: acceptApplication
      summary: O dono aceita a candidatura
      description: >
        Só o dono e só candidatura pendente, com vaga, nível e sem conflito de horário no
        momento do aceite (RN-08, RN-10, RN-11, RN-12, RN-30).
      security:
        - sessionToken: []
      responses:
        "200":
          description: Candidatura aceita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
  /applications/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: rejectApplication
      summary: O dono recusa a candidatura
      description: Só o dono e só candidatura pendente, com justificativa de 10 a 250 caracteres (RN-08, RN-09).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Candidatura recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
        "422":
          $ref: "#/components/responses/Invalid"
  /applications/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: withdrawApplication
      summary: O candidato retira a candidatura pendente
      description: Só a própria candidatura, enquanto pendente (RN-13).
      security:
        - sessionToken: []
      responses:
        "200":
          description: Candidatura retirada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
  /applications/{id}/leave:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: leaveLobby
      summary: O membro sai do grupo
      description: >
        Só a própria candidatura aceita, com o lobby aberto. A vaga volta a ficar livre e o
        pedido de troca pendente é cancelado (RN-14, RN-24).
      security:
        - sessionToken: []
      responses:
        "200":
          description: O membro saiu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
  /applications/{id}/remove:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: removeMember
      summary: O dono remove um membro
      description: >
        Só o dono, com o lobby aberto e justificativa de 10 a 250 caracteres. Com block,
        o Usuário não se candidata de novo a este lobby (RN-07, RN-09, RN-15, RN-24).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveInput"
      responses:
        "200":
          description: Membro removido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
        "422":
          $ref: "#/components/responses/Invalid"
  /applications/{id}/swap-requests:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: requestSwap
      summary: O membro pede a troca do personagem
      description: >
        Só a própria candidatura aceita, com o lobby aberto, um personagem do próprio
        membro com o nível mínimo e motivo de 10 a 250 caracteres; no máximo um pedido
        pendente. O membro continua no grupo com o personagem atual até o dono decidir
        (RN-20, RN-21, RN-36).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapRequestInput"
      responses:
        "201":
          description: Pedido de troca pendente criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
        "422":
          $ref: "#/components/responses/Invalid"
  /swap-requests/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/SwapRequestId"
    post:
      operationId: acceptSwapRequest
      summary: O dono aceita o pedido de troca
      description: >
        Só o dono e só pedido pendente, com vaga na função do personagem novo (a vaga que
        sai conta como livre), o nível mínimo e sem conflito de horário (RN-22, RN-23,
        RN-36). No grupo livre, a troca não depende de vaga (spec grupo-livre, RN-05).
      security:
        - sessionToken: []
      responses:
        "200":
          description: Pedido aceito; o membro já ocupa a vaga com o personagem novo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/SwapRequestNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
  /swap-requests/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/SwapRequestId"
    post:
      operationId: rejectSwapRequest
      summary: O dono recusa o pedido de troca
      description: Só o dono e só pedido pendente, com justificativa de 10 a 250 caracteres (RN-09, RN-22).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Pedido recusado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/SwapRequestNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
        "422":
          $ref: "#/components/responses/Invalid"
  /swap-requests/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/SwapRequestId"
    post:
      operationId: withdrawSwapRequest
      summary: O membro retira o próprio pedido de troca
      description: Só o próprio pedido, enquanto pendente (RN-27).
      security:
        - sessionToken: []
      responses:
        "200":
          description: Pedido retirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapRequest"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/SwapRequestNotFound"
        "409":
          $ref: "#/components/responses/ApplicationRule"
  /me/applications:
    get:
      operationId: listMyApplications
      summary: Minhas candidaturas
      description: As candidaturas do Usuário da sessão, as mais recentes primeiro (RN-33, CA-03.1).
      security:
        - sessionToken: []
      responses:
        "200":
          description: Candidaturas do Usuário.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyApplication"
        "401":
          $ref: "#/components/responses/NoSession"
components:
  parameters:
    LobbyId:
      name: id
      in: path
      required: true
      description: >
        ID do lobby. Desconhecido, malformado ou, nas escritas, de outro Usuário responde
        404 do mesmo jeito (RN-20, D-08).
      schema:
        type: string
    ApplicationId:
      name: id
      in: path
      required: true
      description: ID da candidatura. Desconhecido ou malformado responde 404.
      schema:
        type: string
    SwapRequestId:
      name: id
      in: path
      required: true
      description: ID do pedido de troca. Desconhecido ou malformado responde 404.
      schema:
        type: string
    CharacterId:
      name: id
      in: path
      required: true
      description: >
        ID do personagem. Um ID desconhecido, malformado ou de outro Usuário responde 404
        do mesmo jeito (RN-02, D-08).
      schema:
        type: string
  responses:
    ApplicationNotFound:
      description: A candidatura não existe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    ApplicationRule:
      description: Uma regra da candidatura impede a ação; o web traduz o código (D-07).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApplicationRuleError"
          example:
            error: application_rule
            code: role_full
    SwapRequestNotFound:
      description: O pedido de troca não existe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    LobbyNotFound:
      description: O lobby não existe ou, nas escritas, é de outro Usuário (RN-20).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    LobbyNotOpen:
      description: O lobby já começou ou foi cancelado (D-08).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: lobby_not_open
    NoSession:
      description: Sem sessão, ou sessão desconhecida ou vencida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: no_session
    NotFound:
      description: O personagem não existe ou é de outro Usuário (RN-02).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    Invalid:
      description: Campos inválidos, com o código de cada erro (RN-19, D-07).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            error: validation
            fields:
              - field: nick
                code: taken
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Token de sessão devolvido por POST /auth/discord (ADR-07).
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]
    DiscordLogin:
      type: object
      additionalProperties: false
      required: [code, redirectUri]
      properties:
        code:
          type: string
          minLength: 1
        redirectUri:
          type: string
          format: uri
          description: O mesmo redirect_uri usado na autorização (D-08).
    User:
      type: object
      additionalProperties: false
      required: [id, username, globalName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        globalName:
          type: string
          nullable: true
          description: Nome de exibição no Discord; nulo quando a pessoa não definiu.
    SessionCreated:
      type: object
      additionalProperties: false
      required: [sessionToken, user]
      properties:
        sessionToken:
          type: string
          description: Vai só para o cookie HttpOnly do web; o banco guarda o hash (RN-07).
        user:
          $ref: "#/components/schemas/User"
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_code, discord_unavailable, no_session, not_found, character_limit, character_in_open_lobby, lobby_limit, lobby_not_open, invalid_range]
    Role:
      type: string
      enum: [tank, support, dps]
      description: Função do personagem (RN-08).
    Portrait:
      type: string
      enum: [retrato-1, retrato-2, retrato-3, retrato-4]
      description: >
        Retrato da lista do RO Lobby (RN-10, D-04). Cada valor tem um arquivo em
        web/static/portraits/.
    ClassTier:
      type: string
      enum: [aprendiz, primeira, segunda, transcendental, terceira, quarta, expandida]
    Class:
      type: object
      additionalProperties: false
      required: [id, name, plural, tier, family]
      properties:
        id:
          type: string
          description: Nome sem acento em kebab-case; é o que o personagem guarda (D-03).
          example: guardiao-real
        name:
          type: string
          example: Guardião Real
        plural:
          type: string
          description: Título da página da classe no bROWiki.
          example: Guardiões Reais
        tier:
          $ref: "#/components/schemas/ClassTier"
        family:
          type: string
          description: Classe de 1ª (ou a base, nas expandidas) de onde a linha sai.
          example: Espadachim
    CharacterInput:
      type: object
      required: [nick, classId, level, role]
      description: >
        Dados de um personagem. A API valida todos os campos (RNF-04), com as regras
        RN-04 a RN-10; um valor fora delas volta 422.
      properties:
        nick:
          type: string
          description: 1 a 24 caracteres depois de tirar os espaços das pontas.
        classId:
          type: string
          description: ID de uma classe de GET /classes.
        level:
          type: integer
          description: De 1 a 275.
        role:
          $ref: "#/components/schemas/Role"
        portrait:
          $ref: "#/components/schemas/Portrait"
        link:
          type: string
          description: Opcional; https:// e até 300 caracteres. Vazio fica sem link.
    Character:
      type: object
      additionalProperties: false
      required: [id, nick, classId, level, role, portrait, link, isMain, createdAt, availability]
      properties:
        id:
          type: string
          format: uuid
        nick:
          type: string
        classId:
          type: string
        level:
          type: integer
        role:
          $ref: "#/components/schemas/Role"
        portrait:
          $ref: "#/components/schemas/Portrait"
        link:
          type: string
          nullable: true
        isMain:
          type: boolean
        createdAt:
          type: string
          format: date-time
        availability:
          description: Disponibilidade no banco de talentos; null se nunca entrou (spec banco-de-talentos, CA-01.4).
          allOf:
            - $ref: "#/components/schemas/Availability"
          nullable: true
    AvailabilityInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        days:
          type: array
          description: Dias da semana, domingo = 0.
          items:
            type: integer
        start:
          type: string
          description: HH:MM de Brasília, de 30 em 30 minutos.
        end:
          type: string
          description: HH:MM de Brasília; menor que o início passa da meia-noite (RN-03).
        anyInstance:
          type: boolean
        instanceIds:
          type: array
          items:
            type: string
    Availability:
      type: object
      additionalProperties: false
      required: [enabled, days, start, end, anyInstance, instanceIds]
      properties:
        enabled:
          type: boolean
        days:
          type: array
          description: Dias da semana, domingo = 0.
          items:
            type: integer
        start:
          type: string
        end:
          type: string
        anyInstance:
          type: boolean
        instanceIds:
          type: array
          description: Só as que continuam no catálogo (RN-04).
          items:
            type: string
    AvailabilityResult:
      type: object
      additionalProperties: false
      required: [availability]
      properties:
        availability:
          allOf:
            - $ref: "#/components/schemas/Availability"
          nullable: true
    TalentInstance:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Talent:
      type: object
      additionalProperties: false
      required: [characterId, nick, classId, level, role, portrait, link, days, start, end, anyInstance, instances, removed, blocked]
      properties:
        characterId:
          type: string
          format: uuid
        nick:
          type: string
        classId:
          type: string
        level:
          type: integer
        role:
          $ref: "#/components/schemas/Role"
        portrait:
          $ref: "#/components/schemas/Portrait"
        link:
          type: string
          nullable: true
        days:
          type: array
          items:
            type: integer
        start:
          type: string
        end:
          type: string
        anyInstance:
          type: boolean
        instances:
          type: array
          items:
            $ref: "#/components/schemas/TalentInstance"
        discordUsername:
          type: string
          description: Só com sessão (RN-12, D-05).
        removed:
          type: boolean
          description: A pessoa já foi removida deste lobby (RN-13); sempre false fora do painel do dono.
        blocked:
          type: boolean
          description: Removida com bloqueio deste lobby (RN-13).
    UnblockInput:
      type: object
      additionalProperties: false
      required: [characterId]
      properties:
        characterId:
          type: string
          description: Um personagem da pessoa a desbloquear.
    TalentCount:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count:
          type: integer
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          enum: [nick, classId, level, role, portrait, link, instanceId, startsAt, slots, minLevel, characterId, note, reason, message, days, start, end, instanceIds, day, time, formation, freeSlots, title]
        code:
          type: string
          enum: [required, too_long, too_short, invalid, taken, conflict, below_occupied, above_owner, level_too_low, same_as_start, locked]
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, fields]
      properties:
        error:
          type: string
          enum: [validation]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    InstanceReset:
      type: string
      enum: [daily, three_days, hours, weekly]
      description: Tempo de retorno da instância, como o bROWiki agrupa.
    Instance:
      type: object
      additionalProperties: false
      required: [id, name, level, reset]
      properties:
        id:
          type: string
          example: templo-do-demonio-rei
        name:
          type: string
          example: Templo do Demônio Rei
        level:
          type: integer
          description: Nível de entrada.
          example: 160
        reset:
          $ref: "#/components/schemas/InstanceReset"
    Slots:
      type: object
      additionalProperties: false
      required: [tank, support, dps]
      properties:
        tank:
          type: integer
        support:
          type: integer
        dps:
          type: integer
    LobbyInput:
      type: object
      required: [startsAt, slots, minLevel, characterId]
      properties:
        instanceId:
          type: string
          description: ID de uma instância de GET /instances.
        startsAt:
          type: string
          format: date-time
          description: Início em UTC; o web converte o dia e a hora de Brasília (D-04).
        slots:
          $ref: "#/components/schemas/Slots"
        minLevel:
          type: integer
        characterId:
          type: string
          description: Um dos personagens do Usuário da sessão.
        note:
          type: string
          description: Opcional, até 250 caracteres.
        formation:
          $ref: "#/components/schemas/Formation"
        freeSlots:
          type: integer
          description: Grupo livre, de 2 a 12 vagas; com ele, slots vai zerado (spec grupo-livre, RN-02).
        anyInstance:
          type: boolean
          description: Lobby sem instância; com ele, instanceId é ignorado (spec lobby-sem-instancia, RN-01).
        title:
          type: string
          description: Título do lobby sem instância, até 40 caracteres; vazio aparece como "Qualquer instância" (RN-02).
    LobbyUpdate:
      type: object
      required: [startsAt, slots, minLevel]
      properties:
        instanceId:
          type: string
          description: ID de uma instância de GET /instances. Sem ele, a instância continua a mesma (RN-17).
        startsAt:
          type: string
          format: date-time
        slots:
          $ref: "#/components/schemas/Slots"
        minLevel:
          type: integer
        note:
          type: string
        formation:
          $ref: "#/components/schemas/Formation"
        freeSlots:
          type: integer
          description: Sem formação, mantém a atual; só muda com o grupo vazio (RN-07). Grupo livre, de 2 a 12 vagas; com ele, slots vai zerado (spec grupo-livre, RN-02).
        anyInstance:
          type: boolean
          description: Lobby sem instância; passa para sem instância; sem ele e sem instanceId, continua a atual (spec lobby-sem-instancia, RN-01).
        title:
          type: string
          description: Título do lobby sem instância, até 40 caracteres; vazio aparece como "Qualquer instância" (RN-02).
    Formation:
      type: string
      enum: [roles, free]
      description: Por função (vagas de Tank, Suporte e Dano) ou grupo livre (spec grupo-livre, RN-01).
    CancelLobby:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: De 10 a 250 caracteres.
    LobbyStatus:
      type: string
      enum: [open, started, cancelled]
    LobbyInstance:
      type: object
      additionalProperties: false
      required: [id, name, level, reset]
      properties:
        id:
          type: string
          nullable: true
          description: Nulo no lobby sem instância (spec lobby-sem-instancia, D-02).
        name:
          type: string
          description: Nome guardado na criação (D-02), ou o título do lobby sem instância, ou "Qualquer instância".
        level:
          type: integer
        reset:
          type: string
          enum: [daily, three_days, hours, weekly]
          nullable: true
          description: Nulo se a instância saiu do catálogo.
    LobbyOwner:
      type: object
      additionalProperties: false
      required: [userId, discordName, characterId, nick, classId, level, portrait, link, role]
      properties:
        userId:
          type: string
          format: uuid
        discordName:
          type: string
          nullable: true
          description: >
            Só para o próprio dono e para os membros aceitos; nulo para os outros e na
            lista pública (RN-32 da candidatura-lobby).
        characterId:
          type: string
          format: uuid
          nullable: true
          description: Nulo se o personagem foi excluído depois do início (D-01).
        nick:
          type: string
          nullable: true
        classId:
          type: string
          nullable: true
        level:
          type: integer
          nullable: true
        portrait:
          type: string
          enum: [retrato-1, retrato-2, retrato-3, retrato-4]
          nullable: true
          description: Retrato do personagem do dono (RN-15); nulo se ele foi excluído.
        link:
          type: string
          nullable: true
          description: Link externo do personagem do dono, para o painel do jogador (RN-31).
        role:
          $ref: "#/components/schemas/Role"
    Lobby:
      type: object
      additionalProperties: false
      required: [id, instance, startsAt, status, formation, freeSlots, slots, occupied, pendingCount, minLevel, note, owner, cancelReason, createdAt]
      properties:
        id:
          type: string
          format: uuid
        instance:
          $ref: "#/components/schemas/LobbyInstance"
        startsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/LobbyStatus"
        formation:
          $ref: "#/components/schemas/Formation"
        freeSlots:
          type: integer
          nullable: true
          description: Total de vagas do grupo livre; null por função.
        slots:
          $ref: "#/components/schemas/Slots"
        occupied:
          description: Ocupantes por função; no grupo livre, só informativo, e o total é a soma (D-02 da grupo-livre).
          allOf:
            - $ref: "#/components/schemas/Slots"
        pendingCount:
          type: integer
          description: Candidaturas pendentes; zero depois do início (RN-28, D-02).
        members:
          type: array
          description: Membros aceitos. Só no detalhe (D-06).
          items:
            $ref: "#/components/schemas/LobbyParticipant"
        pending:
          type: array
          description: Candidaturas pendentes. Só no detalhe e só para o dono (RN-28).
          items:
            $ref: "#/components/schemas/LobbyParticipant"
        swapRequests:
          type: array
          description: Pedidos de troca pendentes. Só no detalhe e só para o dono (D-12).
          items:
            $ref: "#/components/schemas/LobbySwapRequest"
        myApplication:
          $ref: "#/components/schemas/ViewerApplication"
        minLevel:
          type: integer
        note:
          type: string
          nullable: true
        owner:
          $ref: "#/components/schemas/LobbyOwner"
        cancelReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ApplicationStatus:
      type: string
      enum: [pending, accepted, rejected, withdrawn, expired, left, removed, cancelled]
      description: Estado da candidatura (RN-17); pendente de lobby iniciado vem como expired (D-02).
    ApplyInput:
      type: object
      required: [characterId]
      properties:
        characterId:
          type: string
          description: Um dos personagens do Usuário da sessão.
        message:
          type: string
          description: Opcional, até 250 caracteres (RN-06).
    RejectInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: De 10 a 250 caracteres (RN-09).
    ApplicationRuleError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
          enum: [application_rule]
        code:
          type: string
          enum: [not_open, own_lobby, already_active, role_full, group_full, rejected_before, below_min_level, schedule_conflict, not_pending, not_owner, not_yours, blocked, not_member, swap_pending]
    Application:
      type: object
      additionalProperties: false
      required: [id, lobbyId, characterId, role, message, status, reason, blocked, createdAt, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        lobbyId:
          type: string
          format: uuid
        characterId:
          type: string
          format: uuid
          nullable: true
          description: Nulo se o personagem foi excluído depois do lobby (RN-26).
        role:
          $ref: "#/components/schemas/Role"
        message:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        reason:
          type: string
          nullable: true
          description: Justificativa da recusa ou da remoção (RN-29, RN-15).
        blocked:
          type: boolean
          description: Removido com bloqueio neste lobby (RN-15).
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
    ViewerApplication:
      type: object
      additionalProperties: false
      required: [id, characterId, role, message, status, reason, blocked, createdAt, decidedAt, swapRequest]
      description: A candidatura mais recente de quem olha o lobby (RN-29, D-06, D-12).
      properties:
        id:
          type: string
          format: uuid
        characterId:
          type: string
          format: uuid
          nullable: true
        role:
          $ref: "#/components/schemas/Role"
        message:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        reason:
          type: string
          nullable: true
        blocked:
          type: boolean
          description: Removido com bloqueio; não se candidata de novo a este lobby (RN-15).
        createdAt:
          type: string
          format: date-time
