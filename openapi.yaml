# Contrato da API do RO Lobby (ADR-05, RN-11). Toda rota nova começa aqui.
# Depois de mudar este arquivo, gere o código de novo:
#   backend: go generate ./...     web: npm run generate
openapi: 3.0.3
info:
  title: RO Lobby API
  version: 0.1.0
  description: API do RO Lobby, lobby de fãs para montar grupos em Ragnarok Online.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Estado da API e do banco
      description: >
        Responde 200 quando o banco responde a um ping em até 2 segundos (RN-06) e
        503 quando não responde nesse prazo (RN-07).
      responses:
        "200":
          description: API e banco saudáveis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                database: ok
        "503":
          description: API no ar, mas o banco não respondeu em até 2 segundos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: degraded
                database: unavailable
  /auth/discord:
    post:
      operationId: createSessionFromDiscord
      summary: Troca o código do Discord por uma sessão
      description: >
        Chamado pelo servidor do web depois do retorno do Discord (ADR-07). A API troca o
        código no Discord, cria ou atualiza o Usuário pelo ID do Discord e abre uma Sessão
        (RN-04, RN-05, RN-07). Se o Discord falhar, nada é criado (RN-13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordLogin"
      responses:
        "201":
          description: Sessão criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          description: O Discord recusou o código, ou o pedido veio sem código.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_code
        "502":
          description: O Discord não respondeu em até 5 segundos ou respondeu com erro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: discord_unavailable
  /me:
    get:
      operationId: getMe
      summary: Usuário da sessão
      description: Responde 401 sem sessão válida (RN-10, RN-16).
      security:
        - sessionToken: []
      responses:
        "200":
          description: Usuário da sessão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Sem sessão, ou sessão desconhecida ou vencida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no_session
  /session:
    delete:
      operationId: deleteSession
      summary: Encerra a sessão atual
      description: Apaga só esta Sessão; outras sessões do Usuário continuam (RN-11).
      security:
        - sessionToken: []
      responses:
        "204":
          description: Sessão encerrada (ou já não existia).
  /classes:
    get:
      operationId: listClasses
      summary: Catálogo de classes
      description: >
        As classes do bRO, conforme o bROWiki, na ordem da página (spec personagens, RN-06,
        RN-20). Não exige sessão.
      responses:
        "200":
          description: Todas as classes do catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
  /characters:
    get:
      operationId: listCharacters
      summary: Personagens do Usuário da sessão
      description: O principal primeiro, depois por ordem de cadastro (RN-01, RN-17).
      security:
        - sessionToken: []
      responses:
        "200":
          description: Personagens do Usuário.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/NoSession"
    post:
      operationId: createCharacter
      summary: Cadastra um personagem
      description: >
        O primeiro personagem do Usuário vira o principal (RN-12). O nick é único em todo o
        RO Lobby, sem diferenciar maiúsculas (RN-05), e cada Usuário tem até 10 personagens
        (RN-11).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Personagem criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/NoSession"
        "409":
          description: O Usuário já tem 10 personagens (RN-11).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: character_limit
        "422":
          $ref: "#/components/responses/Invalid"
  /characters/{id}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: updateCharacter
      summary: Edita um personagem
      description: Grava todos os campos, com as mesmas regras do cadastro (RN-15).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "200":
          description: Personagem editado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O personagem é dono de um lobby aberto (RN-21 da spec lobbies).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: character_in_open_lobby
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteCharacter
      summary: Exclui um personagem
      description: Se era o principal, o mais antigo que sobrar vira o principal (RN-14).
      security:
        - sessionToken: []
      responses:
        "204":
          description: Personagem excluído.
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O personagem é dono de um lobby aberto (RN-21 da spec lobbies).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: character_in_open_lobby
  /characters/{id}/main:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    put:
      operationId: setMainCharacter
      summary: Torna o personagem o principal
      description: O principal anterior deixa de ser (RN-13, D-01).
      security:
        - sessionToken: []
      responses:
        "204":
          description: Personagem marcado como principal.
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/NotFound"
  /instances:
    get:
      operationId: listInstances
      summary: Catálogo de instâncias
      description: >
        As instâncias de grupo do bROWiki, na ordem da escolha: nível 130 ou mais primeiro,
        depois as de nível menor; em cada parte, nível decrescente (spec lobbies, RN-01,
        RN-02). Não exige sessão.
      responses:
        "200":
          description: Todas as instâncias do catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
  /lobbies:
    get:
      operationId: listLobbies
      summary: Lobbies abertos num intervalo de dias
      description: >
        Lobbies abertos (não cancelados e ainda não iniciados) com início entre os dias
        from e to, no fuso de São Paulo, por horário (RN-13, RN-14, RN-22). Não exige
        sessão.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lobbies abertos do intervalo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lobby"
        "400":
          description: Intervalo de datas inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_range
    post:
      operationId: createLobby
      summary: Cria um lobby
      description: >
        O dono escolhe um dos próprios personagens, que ocupa a vaga da função dele
        (RN-08). Cada Usuário tem até 5 lobbies abertos (RN-11), e o personagem não pode
        estar em outro lobby a menos de 2 h (RN-10).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LobbyInput"
      responses:
        "201":
          description: Lobby criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "401":
          $ref: "#/components/responses/NoSession"
        "409":
          description: O Usuário já tem 5 lobbies abertos (RN-11).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: lobby_limit
        "422":
          $ref: "#/components/responses/Invalid"
  /lobbies/{id}:
    parameters:
      - $ref: "#/components/parameters/LobbyId"
    get:
      operationId: getLobby
      summary: Detalhe do lobby
      description: O lobby em qualquer estado (RN-15). Não exige sessão.
      responses:
        "200":
          description: O lobby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "404":
          $ref: "#/components/responses/LobbyNotFound"
    put:
      operationId: updateLobby
      summary: Edita o lobby
      description: >
        Só o dono e só com o lobby aberto. Muda início, vagas, nível mínimo e observação;
        instância e personagem ficam (RN-17, RN-18).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LobbyUpdate"
      responses:
        "200":
          description: Lobby editado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/LobbyNotFound"
        "409":
          $ref: "#/components/responses/LobbyNotOpen"
        "422":
          $ref: "#/components/responses/Invalid"
  /lobbies/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/LobbyId"
    post:
      operationId: cancelLobby
      summary: Cancela o lobby
      description: Só o dono e só com o lobby aberto, com motivo de 10 a 250 caracteres (RN-19).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelLobby"
      responses:
        "200":
          description: Lobby cancelado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lobby"
        "401":
          $ref: "#/components/responses/NoSession"
        "404":
          $ref: "#/components/responses/LobbyNotFound"
        "409":
          $ref: "#/components/responses/LobbyNotOpen"
        "422":
          $ref: "#/components/responses/Invalid"
components:
  parameters:
    LobbyId:
      name: id
      in: path
      required: true
      description: >
        ID do lobby. Desconhecido, malformado ou, nas escritas, de outro Usuário responde
        404 do mesmo jeito (RN-20, D-08).
      schema:
        type: string
    CharacterId:
      name: id
      in: path
      required: true
      description: >
        ID do personagem. Um ID desconhecido, malformado ou de outro Usuário responde 404
        do mesmo jeito (RN-02, D-08).
      schema:
        type: string
  responses:
    LobbyNotFound:
      description: O lobby não existe ou, nas escritas, é de outro Usuário (RN-20).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    LobbyNotOpen:
      description: O lobby já começou ou foi cancelado (D-08).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: lobby_not_open
    NoSession:
      description: Sem sessão, ou sessão desconhecida ou vencida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: no_session
    NotFound:
      description: O personagem não existe ou é de outro Usuário (RN-02).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    Invalid:
      description: Campos inválidos, com o código de cada erro (RN-19, D-07).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            error: validation
            fields:
              - field: nick
                code: taken
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Token de sessão devolvido por POST /auth/discord (ADR-07).
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]
    DiscordLogin:
      type: object
      additionalProperties: false
      required: [code, redirectUri]
      properties:
        code:
          type: string
          minLength: 1
        redirectUri:
          type: string
          format: uri
          description: O mesmo redirect_uri usado na autorização (D-08).
    User:
      type: object
      additionalProperties: false
      required: [id, username, globalName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        globalName:
          type: string
          nullable: true
          description: Nome de exibição no Discord; nulo quando a pessoa não definiu.
    SessionCreated:
      type: object
      additionalProperties: false
      required: [sessionToken, user]
      properties:
        sessionToken:
          type: string
          description: Vai só para o cookie HttpOnly do web; o banco guarda o hash (RN-07).
        user:
          $ref: "#/components/schemas/User"
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_code, discord_unavailable, no_session, not_found, character_limit, character_in_open_lobby, lobby_limit, lobby_not_open, invalid_range]
    Role:
      type: string
      enum: [tank, support, dps]
      description: Função do personagem (RN-08).
    Portrait:
      type: string
      enum: [retrato-1, retrato-2, retrato-3, retrato-4]
      description: >
        Retrato da lista do RO Lobby (RN-10, D-04). Cada valor tem um arquivo em
        web/static/portraits/.
    ClassTier:
      type: string
      enum: [aprendiz, primeira, segunda, transcendental, terceira, quarta, expandida]
    Class:
      type: object
      additionalProperties: false
      required: [id, name, plural, tier, family]
      properties:
        id:
          type: string
          description: Nome sem acento em kebab-case; é o que o personagem guarda (D-03).
          example: guardiao-real
        name:
          type: string
          example: Guardião Real
        plural:
          type: string
          description: Título da página da classe no bROWiki.
          example: Guardiões Reais
        tier:
          $ref: "#/components/schemas/ClassTier"
        family:
          type: string
          description: Classe de 1ª (ou a base, nas expandidas) de onde a linha sai.
          example: Espadachim
    CharacterInput:
      type: object
      required: [nick, classId, level, role]
      description: >
        Dados de um personagem. A API valida todos os campos (RNF-04), com as regras
        RN-04 a RN-10; um valor fora delas volta 422.
      properties:
        nick:
          type: string
          description: 1 a 24 caracteres depois de tirar os espaços das pontas.
        classId:
          type: string
          description: ID de uma classe de GET /classes.
        level:
          type: integer
          description: De 1 a 275.
        role:
          $ref: "#/components/schemas/Role"
        portrait:
          $ref: "#/components/schemas/Portrait"
        link:
          type: string
          description: Opcional; https:// e até 300 caracteres. Vazio fica sem link.
    Character:
      type: object
      additionalProperties: false
      required: [id, nick, classId, level, role, portrait, link, isMain, createdAt]
      properties:
        id:
          type: string
          format: uuid
        nick:
          type: string
        classId:
          type: string
        level:
          type: integer
        role:
          $ref: "#/components/schemas/Role"
        portrait:
          $ref: "#/components/schemas/Portrait"
        link:
          type: string
          nullable: true
        isMain:
          type: boolean
        createdAt:
          type: string
          format: date-time
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          enum: [nick, classId, level, role, portrait, link, instanceId, startsAt, slots, minLevel, characterId, note, reason]
        code:
          type: string
          enum: [required, too_long, too_short, invalid, taken, conflict, below_occupied, above_owner, level_too_low]
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, fields]
      properties:
        error:
          type: string
          enum: [validation]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    InstanceReset:
      type: string
      enum: [daily, three_days, hours, weekly]
      description: Tempo de retorno da instância, como o bROWiki agrupa.
    Instance:
      type: object
      additionalProperties: false
      required: [id, name, level, reset]
      properties:
        id:
          type: string
          example: templo-do-demonio-rei
        name:
          type: string
          example: Templo do Demônio Rei
        level:
          type: integer
          description: Nível de entrada.
          example: 160
        reset:
          $ref: "#/components/schemas/InstanceReset"
    Slots:
      type: object
      additionalProperties: false
      required: [tank, support, dps]
      properties:
        tank:
          type: integer
        support:
          type: integer
        dps:
          type: integer
    LobbyInput:
      type: object
      required: [instanceId, startsAt, slots, minLevel, characterId]
      properties:
        instanceId:
          type: string
          description: ID de uma instância de GET /instances.
        startsAt:
          type: string
          format: date-time
          description: Início em UTC; o web converte o dia e a hora de Brasília (D-04).
        slots:
          $ref: "#/components/schemas/Slots"
        minLevel:
          type: integer
        characterId:
          type: string
          description: Um dos personagens do Usuário da sessão.
        note:
          type: string
          description: Opcional, até 250 caracteres.
    LobbyUpdate:
      type: object
      required: [startsAt, slots, minLevel]
      properties:
        startsAt:
          type: string
          format: date-time
        slots:
          $ref: "#/components/schemas/Slots"
        minLevel:
          type: integer
        note:
          type: string
    CancelLobby:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: De 10 a 250 caracteres.
    LobbyStatus:
      type: string
      enum: [open, started, cancelled]
    LobbyInstance:
      type: object
      additionalProperties: false
      required: [id, name, level, reset]
      properties:
        id:
          type: string
        name:
          type: string
          description: Nome guardado na criação (D-02).
        level:
          type: integer
        reset:
          type: string
          enum: [daily, three_days, hours, weekly]
          nullable: true
          description: Nulo se a instância saiu do catálogo.
    LobbyOwner:
      type: object
      additionalProperties: false
      required: [userId, discordName, characterId, nick, classId, level, portrait, role]
      properties:
        userId:
          type: string
          format: uuid
        discordName:
          type: string
        characterId:
          type: string
          format: uuid
          nullable: true
          description: Nulo se o personagem foi excluído depois do início (D-01).
        nick:
          type: string
          nullable: true
        classId:
          type: string
          nullable: true
        level:
          type: integer
          nullable: true
        portrait:
          type: string
          enum: [retrato-1, retrato-2, retrato-3, retrato-4]
          nullable: true
          description: Retrato do personagem do dono (RN-15); nulo se ele foi excluído.
        role:
          $ref: "#/components/schemas/Role"
    Lobby:
      type: object
      additionalProperties: false
      required: [id, instance, startsAt, status, slots, occupied, minLevel, note, owner, cancelReason, createdAt]
      properties:
        id:
          type: string
          format: uuid
        instance:
          $ref: "#/components/schemas/LobbyInstance"
        startsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/LobbyStatus"
        slots:
          $ref: "#/components/schemas/Slots"
        occupied:
          $ref: "#/components/schemas/Slots"
        minLevel:
          type: integer
        note:
          type: string
          nullable: true
        owner:
          $ref: "#/components/schemas/LobbyOwner"
        cancelReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
